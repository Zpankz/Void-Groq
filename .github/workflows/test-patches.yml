name: Test Patches

on:
  push:
    branches: [main, dev]
    paths: [src/plugins/**, scripts/test-patches.mjs]
  pull_request:
    branches: [main, dev]
    paths: [src/plugins/**, scripts/test-patches.mjs]

concurrency:
  group: test-patches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-patches:
    name: Validate plugin patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run test:patches
